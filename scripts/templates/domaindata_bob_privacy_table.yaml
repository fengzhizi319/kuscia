apiVersion: kuscia.secretflow/v1alpha1
kind: DomainData
metadata:
  labels:
    kuscia.secretflow/domaindata-type: table
    kuscia.secretflow/domaindata-vendor: manual
    kuscia.secretflow/interconn-protocol-type: kuscia
    kuscia.secretflow/initiator: {{.DOMAIN_ID}}
  name: bob-privacy-table
  namespace: {{.DOMAIN_ID}}
spec:
  attributes:
    description: "{{.DOMAIN_ID}} privacy component test data"
  columns:
    - comment: ""
      name: id2
      type: str
    - comment: ""
      name: name
      type: str
    - comment: ""
      name: id_card
      type: str
    - comment: ""
      name: mobile
      type: str
    - comment: ""
      name: age
      type: int
    - comment: ""
      name: zipcode
      type: str
    - comment: ""
      name: gender
      type: str
    - comment: ""
      name: department
      type: str
    - comment: ""
      name: bonus
      type: float
    - comment: ""
      name: has_disease
      type: int
  dataSource: default-data-source
  name: bob_privacy.csv
  type: table
  relativeURI: bob_privacy.csv
  vendor: manual
  author: {{.DOMAIN_ID}}
